name: Seed Registry deployment foundation

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      registry_commit:
        required: true
        type: string
      api_origin:
        required: true
        type: string

permissions:
  contents: read

jobs:
  non-activating-preflight:
    environment: ${{ inputs.environment }}
    runs-on: [self-hosted, Linux, X64, deucarian]
    steps:
      - name: Check out trusted deployment foundation from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
      - name: Reject a non-exact commit identity
        shell: bash
        run: '[[ "$REGISTRY_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
        env:
          REGISTRY_COMMIT: ${{ inputs.registry_commit }}
      - name: Read repository and target protection
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
        shell: bash
        run: |
          test "${{ github.repository_id }}" = "1311366821"
          test "${{ github.repository }}" = "Deucarian/dauva-seeds"
          gh api "repos/${{ github.repository }}" > "$RUNNER_TEMP/repository.json"
          branch="${TARGET_REF#refs/heads/}"
          gh api "repos/${{ github.repository }}/branches/$branch/protection" \
            > "$RUNNER_TEMP/protection.json"
      - name: Prove the deployment foundation remains non-activating
        env:
          DAUVA_SEED_PUBLICATION_ACTIVATION: ${{ vars.DAUVA_SEED_PUBLICATION_ACTIVATION }}
        run: >-
          node trusted/tools/publication-preconditions.mjs
          --phase foundation
          --environment "${{ inputs.environment }}"
          --target-ref "${{ inputs.target_ref }}"
          --api-origin "${{ inputs.api_origin }}"
          --activation "$DAUVA_SEED_PUBLICATION_ACTIVATION"
          --repository "$RUNNER_TEMP/repository.json"
          --protection "$RUNNER_TEMP/protection.json"
          --verification-roots trusted/trust/seed-studio-verification-roots.json
