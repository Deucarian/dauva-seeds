name: Seed Studio publication foundation

on:
  workflow_call:
    inputs:
      publication_id:
        required: true
        type: string
      publication_attempt:
        required: true
        type: number
      environment:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      api_origin:
        required: true
        type: string
    secrets:
      publication_attempt_token:
        required: true

permissions:
  contents: read

jobs:
  non-activating-preflight:
    environment: ${{ inputs.environment }}
    runs-on: [self-hosted, Linux, X64, deucarian]
    steps:
      - name: Check out trusted foundation from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
      - name: Mask and validate the publication attempt correlation
        id: publication-claim
        env:
          DAUVA_SEED_PUBLICATION_ATTEMPT_TOKEN: ${{ secrets.publication_attempt_token }}
        shell: bash
        run: |
          echo "::add-mask::$DAUVA_SEED_PUBLICATION_ATTEMPT_TOKEN"
          node trusted/tools/publication-claim-contract.mjs \
            --publication-id "${{ inputs.publication_id }}" \
            --publication-attempt "${{ inputs.publication_attempt }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Read repository and target protection
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
        shell: bash
        run: |
          test "${{ github.repository_id }}" = "1311366821"
          test "${{ github.repository }}" = "Deucarian/dauva-seeds"
          gh api "repos/${{ github.repository }}" > "$RUNNER_TEMP/repository.json"
          branch="${TARGET_REF#refs/heads/}"
          gh api "repos/${{ github.repository }}/branches/$branch/protection" \
            > "$RUNNER_TEMP/protection.json"
      - name: Prove the foundation remains non-activating
        env:
          DAUVA_SEED_PUBLICATION_ACTIVATION: ${{ vars.DAUVA_SEED_PUBLICATION_ACTIVATION }}
        run: >-
          node trusted/tools/publication-preconditions.mjs
          --phase foundation
          --environment "${{ inputs.environment }}"
          --target-ref "${{ inputs.target_ref }}"
          --api-origin "${{ inputs.api_origin }}"
          --activation "$DAUVA_SEED_PUBLICATION_ACTIVATION"
          --repository "$RUNNER_TEMP/repository.json"
          --protection "$RUNNER_TEMP/protection.json"
          --verification-roots trusted/trust/seed-studio-verification-roots.json
