name: Validate Seed Registry

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    # Public pull requests contain untrusted code. Keep validation on an
    # ephemeral GitHub-hosted runner instead of the Deucarian host.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: proposed
      - name: Check out the immutable pull-request base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: stable-base
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: proposed/package-lock.json
      - name: Select the fail-closed validation profile
        id: profile
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "profile=full" >> "$GITHUB_OUTPUT"
            echo "reason=not-a-pull-request" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.pull_request.base.ref }}" != "main" ] || \
             [ "${{ github.event.pull_request.head.ref }}" != "automation/seed-image-updates" ] || \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ] || \
             [ "${{ github.event.pull_request.draft }}" != "true" ]; then
            echo "profile=full" >> "$GITHUB_OUTPUT"
            echo "reason=ordinary-or-reviewable-pull-request" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f stable-base/tools/ci-validation-profile.mjs
          git -C proposed diff --name-status \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            > "$RUNNER_TEMP/seed-registry-changes.txt"
          node stable-base/tools/ci-validation-profile.mjs \
            --event "$GITHUB_EVENT_PATH" \
            --changes "$RUNNER_TEMP/seed-registry-changes.txt" \
            --base-repository stable-base \
            --candidate-repository proposed \
            --github-output "$GITHUB_OUTPUT"
      - name: Install proposed dependencies
        run: npm ci
        working-directory: proposed
      - name: Run the complete proposed-Registry check
        if: steps.profile.outputs.profile == 'full'
        run: npm run check
        working-directory: proposed
      - name: Prove the immutable stable base
        if: steps.profile.outputs.profile == 'candidate'
        run: |
          npm ci
          npm run check
        working-directory: stable-base
      - name: Validate and compile-check the generated candidate
        if: steps.profile.outputs.profile == 'candidate'
        run: |
          npm run validate
          npm run compile -- --check
        working-directory: proposed
